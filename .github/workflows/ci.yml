name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate expo-env.d.ts
        # Normally auto-generated by `expo start`/`expo prebuild`; it's gitignored, so a
        # fresh checkout needs it recreated before tsc can resolve the *.css module types
        # (see CLAUDE.md's "Commands" section).
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Web bundle sanity check
        run: npx expo export --platform web
